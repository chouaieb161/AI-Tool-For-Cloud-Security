name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: aisecurityacr1
  BACKEND_IMAGE: ai-tool-for-cloud-security-backend
  FRONTEND_IMAGE: ai-tool-for-cloud-security-frontend
  BACKEND_APP: ai-security-api
  FRONTEND_APP: ai-security-web
  RESOURCE_GROUP: rg-ai-security
  CONTAINER_APP_ENV: managedEnvironment-rgaisecurity-a3fb
  BACKEND_URL: https://ai-security-api.livelyrock-5656839c.spaincentral.azurecontainerapps.io

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest \
            --build-arg HF_TOKEN=${{ secrets.HF_TOKEN }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest

      - name: Deploy backend to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: .
          acrName: ${{ env.ACR_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          targetPort: 8000
          minReplicas: 0
          maxReplicas: 1
          ingress: external
          environmentVariables: |
            GCP_AGENT_RUNNER=real
            CHROMA_CIS_PATH=/data/chroma_cis
            CIS_EMBED_DEVICE=cpu
            CIS_ENABLE_RERANK=0
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GCP_AUDIT_SCOPE=${{ secrets.GCP_AUDIT_SCOPE }}
            OCI_SUPABASE_URL=${{ secrets.OCI_SUPABASE_URL }}
            OCI_SUPABASE_KEY=${{ secrets.OCI_SUPABASE_KEY }}
            OCI_VECTOR_STORE=${{ secrets.OCI_VECTOR_STORE }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ env.BACKEND_URL }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest

      - name: Deploy frontend to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: .
          acrName: ${{ env.ACR_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.FRONTEND_APP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          targetPort: 80
          minReplicas: 0
          maxReplicas: 1
          ingress: external
