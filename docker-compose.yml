services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloud-security-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres.ichzwwviywvhioqtoolj:Chouaieb%402026@aws-1-eu-central-2.pooler.supabase.com:5432/postgres?sslmode=require
      GCP_AGENT_RUNNER: real
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/fldr-network-prj-ba77-a45d5a5801b1.json
